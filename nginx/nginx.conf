upstream loadbalancer {
    # Рабочие процессы используют общее состояние группы для round-robin.
    zone backends 64k;
    server app1:8080;
    server app2:8080;
}

server {
    listen 443 ssl;
    server_name localhost;

    # Сертификат и ключ создаёт сценарий запуска в этом же контейнере.
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Браузер запрашивает значок отдельно от страницы.
    location = /favicon.ico {
        return 204;
    }

    location / {
        proxy_pass http://loadbalancer;
    }
}
